<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV Studio</title>
<style>
/* ---------- App shell ---------- */
*{box-sizing:border-box;}
body{margin:0;background:#ffffff;font-family:"Microsoft YaHei","Segoe UI",sans-serif;font-size:13px;color:#222;}
.topbar{position:sticky;top:0;z-index:50;background:#eef6fc;color:#2f4b62;border-bottom:1px solid #cfe3f1;display:flex;align-items:center;gap:8px;padding:8px 14px;flex-wrap:nowrap;white-space:nowrap;overflow:visible;}
.topbar select.menu{background:#f4f9fd;color:#4a6a84;cursor:pointer;}
.topbar .brand{font-weight:bold;font-size:15px;margin-right:6px;}
.tabs{display:flex;gap:4px;}
.tabs button{background:#f4f9fd;color:#4a6a84;border:1px solid #bcd7ea;border-radius:999px;padding:3px 9px;cursor:pointer;font-size:11.5px;line-height:1.3;min-width:34px;}
.tabs button.on{background:#6fb3e0;color:#fff;border-color:#6fb3e0;font-weight:bold;}
.topbar select{padding:5px 8px;border-radius:6px;border:1px solid #bcd7ea;background:#fff;color:#2f4b62;font-size:13px;}
.topbar .mini.tb{background:#f4f9fd;color:#4a6a84;border:1px solid #bcd7ea;padding:4px 8px;}
.topbar .grow{flex:1;}
#verSel{max-width:170px;}.dd{position:relative;}
.dd .ddb{background:#f4f9fd;color:#4a6a84;border:1px solid #bcd7ea;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px;}
.dd .ddb.primary{background:#6fb3e0;color:#fff;border-color:#6fb3e0;font-weight:bold;padding:6px 14px;}
.dd .ddm{display:none;position:absolute;top:calc(100% + 4px);left:0;min-width:160px;background:#fff;border:1px solid #cfe3f1;border-radius:8px;box-shadow:0 6px 18px rgba(47,75,98,.15);padding:4px;z-index:60;white-space:nowrap;}
.dd .ddm.right{left:auto;right:0;}
.dd.open .ddm{display:block;}
.dd .ddm div{padding:7px 12px;border-radius:5px;cursor:pointer;color:#2f4b62;font-size:13px;}
.dd .ddm div:hover{background:#eaf4fb;}
.dd .ddm div.warn{color:#c0392b;}#presetSel{min-width:110px;}
.topbar button.act{background:#6fb3e0;color:#fff;border:none;border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px;}
.topbar button.act.gray{background:#9dbdd3;}
.pageinfo{font-size:12px;color:#5f7d95;overflow:hidden;text-overflow:ellipsis;min-width:0;flex-shrink:1;}
.wrap{display:flex;gap:18px;padding:16px;align-items:flex-start;}
@media (max-width:1180px){.wrap{flex-direction:column;}.editor{width:100%!important;max-height:none!important;position:static!important;}}

/* ---------- Editor ---------- */
.editor{width:430px;flex-shrink:0;background:#ffffff;border:1px solid #d7e6f1;border-radius:10px;padding:14px;max-height:calc(100vh - 76px);overflow-y:auto;position:sticky;top:60px;}
.editor h3{margin:4px 0 8px;font-size:14px;color:#3d5a72;border-bottom:1px solid #d7e6f1;padding-bottom:5px;}
.fld{margin-bottom:6px;}
.fld label{display:block;font-size:11px;color:#888;margin-bottom:2px;}
.fld select{width:100%;padding:5px 7px;border:1px solid #cfe0ec;border-radius:5px;font-size:12.5px;}
.fld input,.fld textarea{width:100%;padding:5px 7px;border:1px solid #cfe0ec;border-radius:5px;font-size:12.5px;font-family:inherit;}
.fld textarea{resize:vertical;line-height:1.5;}
.sec{border:1px solid #e9e2d0;border-radius:8px;padding:10px;margin-bottom:10px;background:#fbf9f1;}
.sec .sechead{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
.sec .sechead input{flex:1;font-weight:bold;}
.mini{background:#f1f7fb;border:1px solid #c9dfee;border-radius:5px;padding:2px 8px;cursor:pointer;font-size:12px;color:#3d5a72;}
.mini:hover{background:#e0eff9;}
.mini.warn{color:#b3261e;}
.entry{border:1px dashed #d8d0bc;border-radius:6px;padding:8px;margin-bottom:8px;background:#fff;}
.entry .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.namephoto{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;}
.photobox{display:flex;gap:8px;align-items:center;}
.photobox img{width:36px;height:50px;object-fit:cover;border:1px solid #ccc;}
.photobox .noph{width:36px;height:50px;border:1px dashed #ccc;display:inline-flex;align-items:center;justify-content:center;color:#aaa;font-size:11px;}
.brow{border:1px solid #e9e2d0;border-radius:6px;padding:6px 6px 4px;margin-bottom:6px;background:#fffdf6;}
.brhead{display:flex;gap:4px;margin-bottom:4px;}
.lnum{font-size:11px;color:#888;min-width:36px;text-align:right;align-self:center;white-space:nowrap;}.lnum.orph{color:#c33;font-weight:700;}
.brhead input{flex:1;padding:4px 6px;border:1px solid #cfe0ec;border-radius:5px;font-size:12px;font-weight:600;}
.brow textarea{width:100%;padding:4px 6px;border:1px solid #cfe0ec;border-radius:5px;font-size:12px;font-family:inherit;resize:vertical;line-height:1.45;}
.crow{display:grid;grid-template-columns:1.1fr 1.4fr auto auto;gap:4px;margin-bottom:4px;}
.crow input{padding:4px 6px;border:1px solid #cfe0ec;border-radius:5px;font-size:12px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px;}
.grid4 input{padding:4px 5px;}
.sec.locked{border-color:#c9dfee;background:#f4f9fd;}
.entry .ebtns{display:flex;gap:6px;justify-content:flex-end;margin-top:4px;}
.addrow{display:flex;gap:8px;margin:4px 0 14px;}
.hint{font-size:11px;color:#999;margin:2px 0 8px;}

/* ---------- Preview ---------- */
.pvwrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;background:#eef6fc;border-radius:10px;padding:12px 12px 24px;align-self:stretch;}
.pvscroll{overflow-x:auto;max-width:100%;}
.zoombar{position:sticky;top:50px;z-index:40;display:flex;gap:4px;align-items:center;background:#ffffff;border:1px solid #d7e6f1;border-radius:999px;padding:3px 6px 3px 10px;font-size:12px;color:#3d5a72;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.zoombar button{background:#f1f7fb;border:1px solid #c9dfee;border-radius:999px;padding:2px 9px;cursor:pointer;font-size:12px;color:#3d5a72;line-height:1.3;}
.zoombar button:hover{background:#e0eff9;}.zoombar button.on{background:#6fb3e0;border-color:#6fb3e0;color:#fff;font-weight:bold;}
.zoombar .pct{min-width:42px;text-align:center;font-weight:bold;}
.page[lang="fr"]{hyphens:auto;-webkit-hyphens:auto;}
.page{width:210mm;background:#fff;/* 与打印纸宽完全一致(793.7px)，否则中文按字折行时0.3px的差异就会多出一行 */box-shadow:0 2px 10px rgba(0,0,0,.2);position:relative;
  --mv:19mm;--mh:21mm;--fs:13px;--lh:1.38;--sg:20px;--eg:12px;--bg:2px;--ph:30mm;
  padding:var(--mvt,var(--mv)) var(--mh) var(--mv) var(--mh)!important;font-size:var(--fs)!important;line-height:var(--lh)!important;}
.page h2{margin:var(--sg) 0 calc(var(--sg)*0.35)!important;}
.page ul{margin:.15em 0 var(--eg)!important;}
.page.cn ul,.page.cn2 ul,.page.classic ul{margin:.08em 0 var(--eg)!important;}
.page li{margin-bottom:var(--bg)!important;text-wrap:pretty;}
.page .name{font-size:calc(var(--fs)*1.9)!important;line-height:1.1!important;letter-spacing:.03em;}
.page h2{font-size:calc(var(--fs)*var(--h2r,1))!important;}
.page.fin{--h2r:1;} .page.tech{--h2r:1.15;} .page.cn,.page.cn2{--h2r:1.15;} .page.fr,.page.fr2,.page.fr3{--h2r:1.15;} .page.classic{--h2r:1.15;}
.page .tagline{font-size:calc(var(--fs)*0.95)!important;margin-top:.45em!important;}
.page .sub,.page .row .r{font-size:calc(var(--fs)*0.96)!important;}
.page .row2{font-weight:bold;}.page.cn .row2,.page.cn2 .row2{font-weight:bold;}
.page .row .r,.page .sub .r{white-space:nowrap;padding-left:.9em;padding-right:.08em;}/* 斜体末字母出格被打印裁切，留一点点 */
.page.fin .sub,.page.fin .row .r{font-size:calc(var(--fs)*1.0)!important;}
.page .contact{font-size:calc(var(--fs)*0.93)!important;line-height:1.2!important;margin:.7em 0 0!important;}
.page .tagline+.contact{margin-top:.35em!important;}
/* 中文1保持原页眉比例 */
.page.cn0 .name{font-size:calc(var(--fs)*1.62)!important;letter-spacing:normal;}
.page.cn0 .tagline{font-size:calc(var(--fs)*1.0)!important;margin-top:.1em!important;}
/* 中文姓名仅三字，中文2/3加字距 */
.page.cn .name,.page.cn2 .name{letter-spacing:.06em;}
/* 联系方式层级色统一 */
.page.en0 .contact,.page.fr0 .contact,.page.cn .contact{color:#444;}
.page .hdr+h2{margin-top:calc(var(--sg)*0.45)!important;}
.pagemark{position:absolute;left:0;right:0;border-top:1.5px dashed #e05252;pointer-events:none;}
.pagemark::after{content:attr(data-t);position:absolute;right:4px;top:-16px;font-size:10px;color:#e05252;background:#fff;padding:0 4px;}

/* ---------- Preset: fin ---------- */
.page.fin{--ffd:"Times New Roman",Times,serif;padding:56px 64px;font-family:var(--ff,var(--ffd));color:#111;font-size:13px;line-height:1.38;}
.fin .name{text-align:center;font-size:21px;font-weight:bold;letter-spacing:.03em;}
.fin .tagline{text-align:center;font-size:13px;color:#333;margin-top:.15em;}
.fin .contact{text-align:center;font-size:12px;margin-top:.3em;color:#222;}
.fin h2{font-size:13px;letter-spacing:.04em;text-transform:uppercase;border-bottom:1.2px solid #111;padding-bottom:.15em;margin:20px 0 8px;font-weight:bold;}
.fin .row{display:flex;justify-content:space-between;font-weight:bold;}
.fin .row .r{font-weight:normal;font-style:italic;}
.fin .sub{display:flex;justify-content:space-between;font-style:italic;margin-bottom:.15em;}
.fin ul{margin:2px 0 12px;padding-left:1.4em;}
.fin li{margin-bottom:.15em;}

/* ---------- Preset: tech ---------- */
.page.tech{--ffd:Calibri,Arial,sans-serif;padding:48px 56px;font-family:var(--ff,var(--ffd));color:#1a1a1a;font-size:13.5px;line-height:1.42;}
.tech .name{font-size:24px;font-weight:bold;}
.tech .tagline{font-size:13.5px;color:#555;}
.tech .contact{font-size:12.5px;color:#444;margin:.25em 0 .15em;}
.tech h2{font-size:14px;color:#0b57a4;text-transform:uppercase;letter-spacing:.03em;margin:18px 0 6px;border-bottom:1.5px solid #0b57a4;padding-bottom:.15em;}
.tech .row{display:flex;justify-content:space-between;font-weight:bold;}
.tech .row .r{font-weight:normal;color:#555;}
.tech .sub{display:flex;justify-content:space-between;font-style:italic;color:#333;margin-bottom:.15em;}
.tech ul{margin:2px 0 10px;padding-left:1.4em;}
.tech li{margin-bottom:.15em;}

/* ---------- Preset: classic (经典版本1 · 原版排法) ---------- */
.page.cn0{--ffd:"Microsoft YaHei","PingFang SC",sans-serif;} .page.en0,.page.fr0{--ffd:Arial,Helvetica,sans-serif;}
.page.en0,.page.cn0,.page.fr0{padding:40px 50px;font-family:var(--ff,var(--ffd));color:#111;font-size:13px;line-height:1.5;}
.classic .name{font-size:22px;font-weight:bold;text-align:center;}
.classic .tagline{font-size:13px;color:#111;text-align:center;margin-top:.1em;}
.classic .contact{font-size:13px;color:#111;text-align:center;margin:.2em 0 .1em;}
.classic .contact a{color:#0563c1;text-decoration:underline;}
.classic h2{font-size:15px;font-weight:bold;margin:12px 0 4px;padding-bottom:.05em;border-bottom:1.5px solid #111;}
.classic .row{display:flex;justify-content:space-between;font-weight:bold;}
.classic .row .r{font-weight:bold;white-space:nowrap;padding-left:.9em;}
.classic .sub{display:flex;justify-content:space-between;color:#111;margin-bottom:.1em;}
.classic ul{margin:0 0 3px;padding-left:0;list-style:none;}
.classic li{margin-bottom:0;}
.classic li::before{content:"● ";font-size:.85em;}
.classic .lb{font-weight:bold;} .classic .lb.lbk{font-weight:normal;}
/* 经典骨架修正（en0/cn0/fr0）：只有机构名粗，职位/日期常规，bullet 悬挂缩进 + 轻圆点 */
.page.classic .row{font-weight:normal;}
.page.classic .row .r{font-weight:normal;color:#444;}
.page.classic .row2{font-weight:normal;}
.page.classic ul{padding-left:1.05em;}
.page.classic li{text-indent:-1.05em;}
.page.classic li::before{content:"\2022\00a0";font-size:1em;}
/* EN1 经典：藏青强调色（原 EN5 已并入） */
.page.en0,.page.fr0{--ac:#1f3a5f;}
.en0 .name,.fr0 .name{color:var(--ac);}
.en0 h2,.fr0 h2{color:var(--ac);border-bottom-color:var(--ac);}
.en0 .contact a,.fr0 .contact a{color:var(--ac);}
.en0 li::before,.fr0 li::before{color:var(--ac);}
.classic .photo{border:none;}
.page.classic .hdr.hasphoto{padding-left:calc(var(--phpad,var(--ph))*0.72 + 6mm);}

/* ---------- Preset: cn (浅底色标题·居中表头) ---------- */
.page.cn{--ffd:"Microsoft YaHei","PingFang SC",sans-serif;padding:52px 60px;font-family:var(--ff,var(--ffd));color:#111;font-size:13px;line-height:1.5;}
.cn .name{font-size:22px;font-weight:bold;text-align:center;}
.cn .tagline{font-size:13px;color:#333;text-align:center;margin-top:.15em;}
.cn .contact{font-size:12.5px;color:#111;text-align:center;margin:.25em 0;}
.cn .contact a{color:#0563c1;text-decoration:underline;}
.cn h2{font-size:15px;font-weight:bold;color:#1f3a5f;background:#e9eff6;border-left:4px solid #1f3a5f;padding:.18em .7em;margin:14px 0 6px;line-height:1.25;}
.cn .row{display:flex;justify-content:space-between;font-weight:bold;}
.cn .row .r{font-weight:normal;color:#444;white-space:nowrap;padding-left:.9em;}
.cn .sub{display:flex;justify-content:space-between;color:#333;font-size:12.5px;margin-bottom:.15em;}
.cn ul{margin:1px 0 4px;padding-left:0;list-style:none;}
.cn li{margin-bottom:1px;}
.cn li::before{content:"● ";font-size:0.75em;position:relative;top:-1px;}
.cn .lb{font-weight:bold;}
.cn .photo{border:none;}

/* ---------- Preset: cn2 (藏青细线·Typst开源风) ---------- */
.page.cn2{--ffd:"Microsoft YaHei","PingFang SC",sans-serif;padding:52px 60px;font-family:var(--ff,var(--ffd));color:#111;font-size:13px;line-height:1.5;}
.cn2 .hdr{display:block;}
.cn2 .name{font-size:22px;font-weight:bold;color:#284967;}
.cn2 .tagline{font-size:13px;color:#444;margin-top:.15em;}
.cn2 .contact{font-size:12.5px;color:#444;margin-top:.35em;text-align:left;}
.cn2 .contact a{color:#284967;}
.cn2 h2{font-size:15px;font-weight:bold;color:#284967;margin:14px 0 6px;padding-bottom:.1em;border-bottom:1.5px solid #284967;}
.cn2 .row{display:flex;justify-content:space-between;font-weight:bold;}
.cn2 .row .r{font-weight:normal;color:#444;font-size:12.5px;white-space:nowrap;padding-left:.9em;}
.cn2 .lb{color:#111;}
.cn2 ul{margin:1px 0 4px;padding-left:1.4em;}
.cn2 li{margin-bottom:.15em;}
.cn2 .lb{font-weight:bold;}

/* ---------- Preset: fr ---------- */
.page.fr{--ffd:Arial,Helvetica,sans-serif;padding:52px 60px;font-family:var(--ff,var(--ffd));color:#111;font-size:13px;line-height:1.45;}
.fr .name{font-size:22px;font-weight:bold;}
.fr .tagline{font-size:14px;color:#555;margin:.15em 0;}
.fr .contact{font-size:12px;color:#444;margin-bottom:.3em;}
.fr h2{font-size:13.5px;text-transform:uppercase;letter-spacing:.04em;color:#111;border-bottom:1.2px solid #111;padding-bottom:.15em;margin:18px 0 8px;}
.fr .row{display:flex;justify-content:space-between;font-weight:bold;}
.fr .row .r{font-weight:normal;color:#555;}
.fr .sub{display:flex;justify-content:space-between;font-style:italic;color:#333;margin-bottom:.15em;}
.fr ul{margin:2px 0 12px;padding-left:1.4em;}
.fr li{margin-bottom:.15em;}

/* ---------- Preset: fr2 (法语经典·日期左栏) ---------- */
.page.fr2{--ffd:Arial,Helvetica,sans-serif;--h2r:1.15;padding:52px 60px;font-family:var(--ff,var(--ffd));color:#222;font-size:13px;line-height:1.4;}
.page.fr2{--ac:#1f3a5f;--acl:#cfd6df;--h2bg:#e9eef5;--h2fg:#1f3a5f;}
.page.fr3{--ac:#3d3d3d;--acl:#d0d0d0;--h2bg:#3d3d3d;--h2fg:#fff;}
.fr2 .name{font-size:22px;font-weight:bold;color:var(--ac);}
.fr2 .tagline{font-weight:bold;color:var(--ac);margin:.15em 0;}
.fr2 .contact{color:#444;margin-bottom:.3em;}
.fr2 h2{text-transform:uppercase;letter-spacing:.05em;color:var(--h2fg);background:var(--h2bg);padding:.18em .6em;border:none;margin:18px 0 8px;font-weight:bold;}
/* 时间轴：左栏 年份/月份 两行叠放，中间圆点+竖线，右侧正文 */
.fr2 .entryblk{position:relative;padding-left:calc(var(--dtw,4.4em) + 16px + .6em);}
.fr2 .entryblk:before{content:"";position:absolute;left:calc(var(--dtw,4.4em) + 7px);top:.35em;bottom:0;border-left:1.5px solid var(--acl);}
.fr2 .row{display:block;}
.fr2 .row .dt{position:absolute;left:0;width:var(--dtw,4.4em);text-align:right;color:var(--ac);font-weight:bold;white-space:nowrap;font-size:.85em;line-height:1.25;padding-top:.15em;}
.fr2 .row .dt small{display:block;font-weight:normal;font-size:1em;color:#666;}
.fr2 .row .dt:after{content:"";position:absolute;right:-13px;top:.45em;width:8px;height:8px;border-radius:50%;background:var(--ac);}
.fr2 .row .bd b{color:#111;}
.fr2 .row .bd .loc{color:#666;}
.fr2 ul{margin:.15em 0 12px;padding-left:1.1em;}
.fr2 li{margin-bottom:2px;}
.fr2 .lb{font-weight:bold;color:var(--ac);}
/* header w/ photo + summary */
.page .hdr.hasphoto{padding-right:calc(var(--phpad,var(--ph))*0.72 + 6mm);box-sizing:border-box;}
.page.fin .hdr.hasphoto,.page.cn .hdr.hasphoto{padding-left:calc(var(--phpad,var(--ph))*0.72 + 6mm);}
.page .photo{position:absolute;right:var(--mh);top:calc(var(--mvt,var(--mv)) + var(--phtop,0mm));height:var(--ph);width:calc(var(--ph)*0.72);object-fit:cover;border:1px solid #bbb;cursor:nwse-resize;user-select:none;-webkit-user-drag:none;z-index:2;}
@media print{.page .photo{border-width:1px;}}
@media print{.page .photo{right:0;top:var(--phtop,0mm);}}
.page .summary{margin-top:.3em;text-align:justify;}
.fin .summary{font-size:calc(var(--fs)*0.96);}
/* shared preview blocks */
.page .entryblk{page-break-inside:avoid;}
.page .lb{font-weight:bold;}

/* ---------- Print ---------- */
@media print{
  body{background:#fff;}
  .topbar,.editor,.pageinfo2,.pagemark,.zoombar{display:none!important;}
  .wrap{padding:0;display:block;}
  .pvwrap{display:block;padding:0!important;background:none!important;border-radius:0;}
  .pvscroll{overflow:visible;zoom:1!important;}
  .page{width:auto;box-shadow:none;padding:0!important;min-height:0!important;}
}
</style>
<style id="printPage">@page{size:A4;margin:19mm 21mm;}</style>
</head>
<body>
<div class="topbar">
  <span class="brand">CV Studio</span>
  <div class="tabs" id="langTabs"></div>
  <select id="verSel" title="版本"></select>
  <div class="dd" id="verAct"><button class="ddb" type="button">版本 ▾</button><div class="ddm"><div data-v="new">＋ 复制为新版本</div><div data-v="ren">改名</div><div data-v="del" class="warn">删除当前版本</div></div></div>
  <select id="presetSel"></select>
  <span class="pageinfo" id="pageInfo"></span>
  <div class="grow"></div>
  <div class="dd" id="expAct"><button class="ddb primary" type="button">导出 ▾</button><div class="ddm right"><div data-v="pdf_a4">PDF · A4分页</div><div data-v="pdf_long">PDF · 长页（按内容裁）</div><div data-v="word">Word（.doc）</div><div data-v="json">JSON · 当前版本</div><div data-v="json_all">JSON · 全部（换电脑迁移用）</div></div></div>
  <button class="act gray" id="btnImport" title="从JSON备份恢复">导入JSON</button>
  <button id="btnWord" style="display:none"></button><button id="btnPdf" style="display:none"></button>
  <input type="file" id="fileImport" accept=".json" style="display:none">
  <input type="file" id="filePhoto" accept="image/*" style="display:none">
</div>
<div class="wrap">

function contactsOf(doc){

function linkify(h){

var FR_MONTHS={janv:"01",janvier:"01",fevr:"02",fev:"02",fevrier:"02",mars:"03",avr:"04",avril:"04",mai:"05",juin:"06",juil:"07",juillet:"07",aout:"08",sept:"09",septembre:"09",oct:"10",octobre:"10",nov:"11",novembre:"11",dec:"12",decembre:"12"};
function frMon(w){w=String(w).toLowerCase().replace(/\./g,"").normalize("NFD").replace(/[\u0300-\u036f]/g,"");return FR_MONTHS[w]||null;}
function frNumDate(s){s=String(s||"").trim();if(!s)return s;
  var t=s.replace(/\s*[–—-]\s*/g," – ").replace(/\s+/g," ");
  var parts=t.split(" – ");if(parts.length>2)return s;
  function one(p,yFallback){p=p.trim();var m;
    if(/^aujourd/i.test(p)||/^present$/i.test(p))return "NOW";
    if(m=p.match(/^(\d{4})$/))return m[1];
    if(m=p.match(/^(\d{1,2})\/(\d{4})$/))return ("0"+m[1]).slice(-2)+"/"+m[2];
    if(m=p.match(/^([A-Za-zÀ-ÿ.]+)\s+(\d{4})$/)){var mo=frMon(m[1]);return mo?mo+"/"+m[2]:null;}
    if(m=p.match(/^([A-Za-zÀ-ÿ.]+)$/)){var mo2=frMon(m[1]);return mo2&&yFallback?mo2+"/"+yFallback:null;}
    return null;}
  if(parts.length===1){var a=one(parts[0]);return a&&a!=="NOW"?a:s;}
  var yb=(parts[1].match(/(\d{4})\s*$/)||[])[1];
  var A=one(parts[0],yb),B=one(parts[1]);if(!A||!B||A==="NOW")return s;
  return B==="NOW"?"depuis "+A:A+"–"+B;}
/* 时间轴日期拆成 年份 + 月份 两行：{y:"2026",m:"Juin – Sept."} */
function frDateStack(s,nowLabel){nowLabel=nowLabel||"auj.";s=String(s||"").trim();if(!s)return {y:"",m:""};
  var t=s.replace(/\s*[–—-]\s*/g," – ").replace(/\s+/g," "),parts=t.split(" – ");
  function yr(p){var m=p.match(/(\d{4})\s*$/);return m?m[1]:null;}
  function mo(p){return p.replace(/\s*\d{4}\s*$/,"").trim();}
  if(parts.length===1){var y=yr(parts[0]);if(!y)return {y:s,m:""};return {y:y,m:mo(parts[0])};}
  if(parts.length!==2)return {y:s,m:""};
  var a=parts[0],b=parts[1],ya=yr(a),yb=yr(b),now=/^aujourd|^present$/i.test(b);
  if(!ya){if(yb&&!now)return {y:yb,m:mo(a)+" – "+mo(b)};return {y:s,m:""};}
  if(now)return {y:ya,m:(mo(a)?mo(a)+" – ":"– ")+nowLabel};
  if(!yb)return {y:ya,m:mo(a)+" – "+b};
  if(ya===yb)return {y:ya,m:(mo(a)&&mo(b))?mo(a)+" – "+mo(b):(mo(a)||mo(b))};
  if(!mo(a)&&!mo(b))return {y:ya,m:"– "+yb};
  return {y:ya+"–"+yb.slice(2),m:mo(a)+" – "+mo(b)};}

/* ================= autofit（一个松紧度t带动全部旋钮） =================
   规则（只管自适应）：
   0 硬约束：左右边距对称；上边距=左右-2mm（页眉姓名大字自带视觉空白的光学补偿，下限13mm）；下边距=左右，残余空白最多让它比左右多2mm，零头也留在底部。各旋钮只在语言对应的范围内走。
   1 间距全部是"正文行高的倍数"，不是固定毫米：章节间距1.0～1.4行、条目间距0.25～0.5行、bullet间距0.05～0.12行。
     字号变了间距跟着变，层级永远成立：章节间距 > 条目间距 > bullet间距 > 字距。
   2 内容多时：边距候选18→14mm每0.5mm一档，每档二分出能装下的最大字号（行距间距先全紧），
     代价=W_FS×字号让步比例+W_M×边距让步比例（W_FS=3,W_M=1），取代价最小的组合，再把行距/间距从紧往松放到刚好装下。
     效果：先收边距保字号，边距到14mm仍不够才缩字号；不是任何一方绝对优先，而是按权重动态平衡。
   3 t=1仍装不下：边距锁14mm，字号继续同比缩小（无下限，行距物理下限1.1防叠字），间距倍数不变随字号同缩，层级自动保持。不弹任何提示，删减由用户判断。
   4 内容少：边距先加宽到18mm；孤行处理让出的高度用字号回加填回（间距倍数跟着走，最多3轮）；残余空白依次：上下边距（≤2mm）→条目间距（≤1mm）→章节间距（≤1mm）→零头一半挪到页顶（上下目视相等）。
   5 孤行：只看bullet（li）：≥2行且末行不到行宽30%算孤行，单行bullet和标题/描述行不算。先在边距-1.5~+2.5mm内按0.25mm试宽度、字号±0.5px微抖，选孤行代价最小且仍一页的（相同取更宽、更大）；剩下的单条字距收上去或推满30%，上限中文/法文0.05em、英文0.04em（约Word"紧缩/加宽0.5～0.6磅"），做不到就原样保留、不提示，由用户改文案。
   6 所有测量都在预览缩放100%下进行（缩放会让折行和PDF不一致）。 */
var FIT_RANGE={
  cn:{fs:[12,14.67],lh:[1.35,1.5],sg:[1.0,1.4],eg:[0.25,0.5],bg:[0.05,0.12],m:[14,18]},

function setPath(obj,path,val){
  var ps=path.split("."),o=obj;
  for(var i=0;i<ps.length-1;i++)o=o[ps[i]];

}

});
